<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>three-assistant-glass</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<link rel="stylesheet" href="theme.css" />
		<link rel="stylesheet" href="app.css" />
		<link rel="stylesheet" href="assistant/codex-tasks.css" />
		<script src="https://cdn.jsdelivr.net/gh/balacodeio/Vapi-Web-UMD@latest/dist/latest/vapi-web-bundle.min.js"></script>
	</head>

	<body>
		<div class="hud hud-top-left">
			<select id="animationSelect" class="pill" aria-label="Test an animation" style="display: none">
				<option value="">Test an animation</option>
			</select>
		</div>

		<div class="hud hud-top-right">
			<span id="clock" class="pill" aria-live="off" hidden></span>
			<button id="settingsButton" class="pill icon-button" type="button" title="Settings" aria-label="Open settings" hidden>
				<span class="icon" style="--icon: url('icons/settings.svg')"></span>
			</button>
		</div>

		<section id="captionCard" aria-label="Conversation">
			<span id="captionSpeaker" data-speaker="Character">Character</span>
			<p id="captionText" class="is-idle" aria-live="polite">Loading…</p>
		</section>

		<div id="dock">
			<button id="toggleVapi" class="primary-button" type="button" data-active="false">
				<svg class="when-idle" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
				<svg class="when-active" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="3"/></svg>
				<span class="when-idle">Start</span>
				<span class="when-active">Stop</span>
			</button>
			<span id="assistantStatus" role="status" aria-live="polite"></span>
			<span id="expressionStatus" role="status"></span>
		</div>

		<div id="toasts" aria-live="polite"></div>

		<script type="importmap">
			{
				"imports": {
					"fflate": "https://cdn.jsdelivr.net/npm/fflate@0.7.4/esm/browser.js",
					"three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/",
					"@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
					"@lookingglass/webxr": "https://unpkg.com/@lookingglass/webxr@0.6.0/dist/bundle/webxr.js"
				}
			}
		</script>

		<script src="main.js" type="module"></script>
	</body>
</html>
